<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#6f3f1f">
  <title>Photo</title>
  <link rel="stylesheet" href="./styles.css?v=20261001-3">
  <script defer src="./app.js?v=20261001-3"></script>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="reveal-stage" id="revealStage">
      <div class="table-light" aria-hidden="true"></div>
      <div class="photo-frame">
        <img id="cardPhoto" class="card-photo is-loading" alt="">
      </div>
      <p id="statusText" class="status-text">Đang tải ảnh…</p>
    </section>

    <button id="secretHotspot" class="secret-hotspot" type="button" aria-label="Mở setup, chạm 5 lần"><span>SETUP ×5</span><small id="tapProgress">0/5</small></button>
  </main>

  <dialog id="setupDialog" class="panel-dialog">
    <form method="dialog" class="panel" id="setupForm">
      <header class="panel-header">
        <div>
          <p class="eyebrow">Performer</p>
          <h1>Chọn lá bài</h1>
        </div>
        <button class="icon-button" value="cancel" aria-label="Đóng">×</button>
      </header>

      <div id="deckGrid" class="deck-grid"></div>

      <footer class="panel-footer">
        <div>
          <div id="selectedLabel" class="selected-label">Chưa chọn</div>
          <div id="writeStatus" class="write-status"></div>
        </div>
        <button id="doneButton" class="primary-button" type="button" disabled>Done</button>
      </footer>
    </form>
  </dialog>

  <dialog id="armDialog" class="panel-dialog">
    <form method="dialog" class="panel arm-panel" id="armForm">
      <header class="panel-header">
        <div>
          <p class="eyebrow">One-time device setup</p>
          <h1>Arm performer device</h1>
        </div>
      </header>

      <label class="field">
        <span>Fine-grained GitHub token</span>
        <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
      </label>
      <p class="helper">
        Token chỉ được giữ trong session của tab này. Token phải chỉ có quyền
        <strong>Contents: write</strong> trên repo <strong>Magic-state</strong>.
      </p>
      <div id="armStatus" class="write-status"></div>

      <footer class="panel-footer arm-footer">
        <button id="clearTokenButton" class="secondary-button" type="button">Clear</button>
        <button id="saveTokenButton" class="primary-button" type="button">Arm device</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
